<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>SmartFit Login</title>
</head>
<body class="bg-[#F8F6F1] text-[#5C4033]">

<div class="min-h-screen grid md:grid-cols-2">

  <!-- Left -->
  <div class="flex flex-col justify-between p-8 md:p-14">

    <!-- Logo -->
    <h1 class="text-3xl font-serif text-[#556B2F]">SmartFit</h1>

    <!-- Center -->
    <div class="text-center space-y-6">
      <h2 class="text-5xl font-serif text-[#5C4033]">SmartFit</h2>
      <div class="w-40 h-[2px] bg-[#556B2F] mx-auto"></div>

      <p class="text-sm uppercase tracking-[5px] text-[#6B5B4D]">
        Fashion E-commerce with Smart Virtual Try-On
      </p>

      <button class="bg-[#556B2F] hover:bg-[#465a26] text-white px-6 py-3 rounded-xl flex items-center gap-2 mx-auto text-sm">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5">
        Sign up with Google
      </button>

      <div class="space-y-3 text-sm">
        <a href="page2.html" class="underline text-[#5C4033]">Login</a>
        <p class="text-[#7A6A58]">OR</p>
        <button class="w-[200px] bg-[#8B5E3C] hover:bg-[#734c30] text-white py-2 rounded-xl">
          Login as Guest
        </button>
      </div>
    </div>

    <!-- Footer -->
    <div class="border-t border-[#d8d2c8] pt-4 text-xs text-[#7A6A58] flex flex-wrap gap-4 justify-between">
      <p>© 2026 SmartFit. All Rights Reserved.</p>
      <a href="#">Terms</a>
      <a href="#">Privacy</a>
      <a href="#">Help</a>
    </div>

  </div>

  <!-- Right -->
  <div class="hidden md:flex items-center justify-center bg-[#E7E1D5]">
    <img src="fashionimg.png" alt="Fashion" class="h-full object-cover">
  </div>

</div>

</body>
</html>
