<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<title>SmartFit Login</title>
</head>

<body class="bg-[#F8F6F1] text-[#5C4033]">

<div class="min-h-screen grid md:grid-cols-2">

  <!-- Left Image -->
  <div class="relative hidden md:block">
    <h1 class="absolute top-6 left-8 z-10 text-3xl font-serif text-white">
      SmartFit
    </h1>

    <img
      src="fashionimg.png"
      alt="Fashion"
      class="w-full h-screen object-cover"
    >

    <p class="absolute bottom-5 left-8 text-xs tracking-[2px] text-white">
      © 2026 SmartFit. All Rights Reserved.
    </p>
  </div>

  <!-- Right Content -->
  <div class="flex flex-col justify-center items-center px-8">

    <div class="text-center max-w-sm space-y-5">

      <h2 class="text-6xl font-serif text-[#556B2F]">
        SmartFit
      </h2>

      <div class="w-20 h-px bg-[#8B5E3C] mx-auto"></div>

      <p class="uppercase tracking-[3px] text-xs text-[#6B5B4D]">
        Fashion E-commerce with smart virtual try-on
      </p>

      <h3 class="font-serif text-3xl pt-6">
        Welcome Back
      </h3>

      <button class="w-full mt-8 bg-[#556B2F] text-white py-3 rounded-xl flex items-center justify-center gap-3 hover:opacity-90 transition">
        <img
          src="https://www.svgrepo.com/show/475656/google-color.svg"
          class="w-5 h-5"
          alt="Google"
        >
        Login with Google
      </button>

      <button class="w-full bg-[#8B5E3C] text-white py-3 rounded-xl hover:opacity-90 transition">
        Login as Guest
      </button>

      <p class="pt-10 text-[11px] uppercase tracking-[2px] text-[#7A6A5A]">
        By logging in you agree to our terms and policies.
      </p>

    </div>

    <div class="mt-12 flex gap-6 text-xs text-[#5C4033]">
      <a href="#">Terms</a>
      <a href="#">Privacy</a>
      <a href="#">Cookies</a>
    </div>

  </div>

</div>

</body>
</html>
