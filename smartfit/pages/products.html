<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartFit — Products</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *{font-family:'DM Sans',sans-serif}
    body{background:#f5f4f0}
    .sidebar{background:#fff;width:228px;min-height:100vh;flex-shrink:0;border-right:1px solid #f0f0f0}
    .nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:8px;cursor:pointer;color:#555;font-size:14px;font-weight:500;transition:all .15s}
    .nav-item:hover{background:#f3f2ee;color:#333}
    .nav-item.active{background:#4a5c3a;color:#fff}
    .nav-item svg{width:18px;height:18px;flex-shrink:0}
    .avatar-initials{background:#4a5c3a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;border-radius:9999px}
    .sidebar-promo{background:#f5f4f0;border-radius:12px;overflow:hidden}
    .product-card{background:#fff;border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s}
    .product-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,0.1)}
    .badge{position:absolute;top:10px;left:10px;background:#4a5c3a;color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px}
    .badge.new{background:#3b82f6}
    .badge.trending{background:#f59e0b;color:#1a1a1a}
    .badge.premium{background:#1a1a1a}
    .badge.top-rated{background:#c0392b}
    .wish-btn{position:absolute;top:10px;right:10px;width:30px;height:30px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.12);cursor:pointer;border:none;transition:background .15s}
    .wish-btn:hover{background:#fff5f5}
    .stars{display:flex;gap:2px;align-items:center}
    .filter-chip{padding:6px 14px;border-radius:99px;border:1.5px solid #e5e5e5;font-size:12px;font-weight:600;cursor:pointer;background:#fff;color:#555;transition:all .2s;white-space:nowrap}
    .filter-chip.active{background:#4a5c3a;color:#fff;border-color:#4a5c3a}
    .toast{position:fixed;bottom:24px;right:24px;background:#4a5c3a;color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:500;z-index:9999;opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none}
    .toast.show{opacity:1;transform:translateY(0)}
    select{outline:none}
  </style>
</head>
<body class="flex">

  <!-- SIDEBAR -->
  <aside class="sidebar flex flex-col px-3 py-5">
    <div class="flex items-center gap-2 px-3 mb-6">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><path d="M14 2L4 8v12l10 6 10-6V8L14 2z" fill="#4a5c3a"/><path d="M14 2v24M4 8l10 6 10-6" stroke="#fff" stroke-width="1.2"/></svg>
      <div><div style="font-weight:700;font-size:15px;color:#1a1a1a">SmartFit</div><div style="font-size:10px;color:#999">Fashion with Innovation</div></div>
    </div>
    <nav class="flex flex-col gap-1">
      <div class="nav-item" onclick="location.href='dashboard.html'"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</div>
      <div class="nav-item active"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 2h12l2 6H4L6 2z"/><path d="M4 8h16l-1.5 10H5.5L4 8z"/></svg>Products</div>
      <div class="nav-item" onclick="location.href='orders.html'"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>Orders</div>
      <div class="nav-item" onclick="location.href='wishlist.html'"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>Wishlist</div>
      <div class="nav-item" onclick="location.href='cart.html'"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>Cart</div>
      <div class="nav-item" onclick="location.href='measurements.html'"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2a5 5 0 110 10A5 5 0 0112 2zm0 12c-5.33 0-8 2.67-8 4v2h16v-2c0-1.33-2.67-4-8-4z"/></svg>Measurements</div>
      <div class="nav-item" onclick="location.href='settings.html'"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>Settings</div>
    </nav>
    <div class="sidebar-promo mt-auto mx-1 p-3">
      <div class="flex gap-2 mb-2">
        <img src="https://images.unsplash.com/photo-1552374196-1ab2a1c593e8?w=80&q=80" class="w-12 h-16 object-cover rounded-lg" alt="m1"/>
        <img src="https://images.unsplash.com/photo-1511375927791-e3c26fd5c43b?w=80&q=80" class="w-12 h-16 object-cover rounded-lg" alt="m2"/>
      </div>
      <div class="font-bold text-gray-800 text-sm">New Collection</div>
      <div class="text-xs text-gray-500 mt-1 mb-3">Explore the latest fashion trends.</div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="flex-1 flex flex-col min-h-screen">
    <!-- Topbar -->
    <header class="bg-white border-b border-gray-100 flex items-center gap-4 px-6 py-3 sticky top-0 z-10">
      <div class="flex items-center gap-2 bg-gray-50 rounded-full px-4 py-2 flex-1 max-w-[420px]">
        <svg width="16" height="16" fill="none" stroke="#999" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input id="searchInput" type="text" placeholder="Search products..." class="bg-transparent text-sm outline-none text-gray-500 w-full"/>
      </div>
      <div class="flex items-center gap-5 ml-auto">
        <button onclick="location.href='cart.html'" class="relative bg-transparent border-none cursor-pointer">
          <svg width="20" height="20" fill="none" stroke="#555" stroke-width="2" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
          <span id="cartBadge" style="display:none;position:absolute;top:-6px;right:-6px;background:#4a5c3a;color:#fff;font-size:10px;font-weight:700;width:16px;height:16px;border-radius:99px;align-items:center;justify-content:center;"></span>
        </button>
        <div class="flex items-center gap-2 cursor-pointer" onclick="location.href='settings.html'">
          <div id="topbar-avatar" class="w-8 h-8 rounded-full overflow-hidden flex-shrink-0"></div>
          <div id="topbar-name" class="text-sm font-semibold text-gray-800">Loading...</div>
        </div>
        <button id="logoutBtn" class="text-xs font-semibold text-gray-500 border border-gray-200 rounded-full px-3 py-1.5 hover:bg-gray-50 transition flex items-center gap-1">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg> Logout
        </button>
      </div>
    </header>

    <main class="flex-1 p-6">
      <div class="flex items-center justify-between mb-5">
        <div>
          <h1 class="text-2xl font-bold text-gray-800">Products</h1>
          <p class="text-sm text-gray-500 mt-0.5" id="resultCount">Showing all products</p>
        </div>
        <select id="sortSelect" class="border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-600 bg-white cursor-pointer">
          <option value="default">Sort: Default</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="rating">Top Rated</option>
          <option value="name">Name A–Z</option>
        </select>
      </div>

      <!-- Category filters -->
      <div class="flex gap-2 mb-6 flex-wrap" id="catFilters">
        <button class="filter-chip active" data-cat="All">All</button>
        <button class="filter-chip" data-cat="shirts">Shirts</button>
        <button class="filter-chip" data-cat="tops">Tops</button>
        <button class="filter-chip" data-cat="bottoms">Bottoms</button>
        <button class="filter-chip" data-cat="jackets">Jackets</button>
        <button class="filter-chip" data-cat="shoes">Shoes</button>
        <button class="filter-chip" data-cat="accessories">Accessories</button>
      </div>

      <!-- Products Grid -->
      <div id="productsGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4"></div>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module">
    import { auth } from "../js/firebase-config.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { PRODUCTS, addToCart, toggleWishlist, isWishlisted, getCart, starsHTML } from "../js/products-data.js";
    import { renderAvatar } from "../js/auth.js";

    onAuthStateChanged(auth, u => {
      if (!u) { location.href = "login.html"; return; }
      document.getElementById("topbar-name").textContent = (u.displayName || "User").split(" ")[0];
      renderAvatar("topbar-avatar", u.photoURL, u.displayName, "w-8 h-8 text-xs");
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOut(auth); location.href = "login.html";
    });

    let currentCat = "All";
    let currentQ   = "";
    let currentSort= "default";

    // Read URL param ?q=
    const urlQ = new URLSearchParams(location.search).get("q") || "";
    if (urlQ) { currentQ = urlQ; document.getElementById("searchInput").value = urlQ; }

    function getFiltered() {
      let list = PRODUCTS.filter(p => {
        const matchCat = currentCat === "All" || p.category === currentCat;
        const matchQ   = !currentQ || p.name.toLowerCase().includes(currentQ.toLowerCase()) || p.category.includes(currentQ.toLowerCase());
        return matchCat && matchQ;
      });
      if (currentSort === "price-asc")  list = [...list].sort((a,b) => a.price - b.price);
      if (currentSort === "price-desc") list = [...list].sort((a,b) => b.price - a.price);
      if (currentSort === "rating")     list = [...list].sort((a,b) => b.rating - a.rating);
      if (currentSort === "name")       list = [...list].sort((a,b) => a.name.localeCompare(b.name));
      return list;
    }

    function render() {
      const list  = getFiltered();
      const grid  = document.getElementById("productsGrid");
      const count = document.getElementById("resultCount");
      count.textContent = `Showing ${list.length} product${list.length !== 1 ? "s" : ""}`;
      grid.innerHTML = list.map(p => {
        const wished = isWishlisted(p.id);
        const badgeClass = p.badge ? p.badge.toLowerCase().replace(" ","-") : "";
        return `
        <div class="product-card" id="pc-${p.id}">
          <div class="relative">
            <img src="${p.img}" alt="${p.name}" style="width:100%;height:200px;object-fit:cover"/>
            ${p.badge ? `<span class="badge ${badgeClass}">${p.badge}</span>` : ""}
            <button class="wish-btn" data-id="${p.id}" aria-label="wishlist">
              <svg width="14" height="14" fill="${wished ? '#e53e3e' : 'none'}" stroke="${wished ? '#e53e3e' : '#555'}" stroke-width="2" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
            </button>
          </div>
          <div style="padding:12px">
            <div style="font-size:13px;font-weight:600;color:#1a1a1a;margin-bottom:4px">${p.name}</div>
            <div class="stars" style="margin-bottom:6px">${starsHTML(p.rating)}<span style="font-size:11px;color:#888;margin-left:4px">(${p.reviews})</span></div>
            <div style="display:flex;align-items:center;justify-content:space-between">
              <span style="font-size:15px;font-weight:700;color:#1a1a1a">$${p.price.toFixed(2)}</span>
              <button onclick="quickAdd('${p.id}')" style="background:#4a5c3a;color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:11px;font-weight:600;cursor:pointer">+ Cart</button>
            </div>
            <button onclick="location.href='product-details.html?id=${p.id}'" style="width:100%;margin-top:8px;padding:7px;border:1.5px solid #e5e5e5;border-radius:8px;font-size:12px;font-weight:600;background:#fff;cursor:pointer;color:#555">View Details</button>
          </div>
        </div>`;
      }).join("");

      // Wishlist buttons
      grid.querySelectorAll(".wish-btn").forEach(btn => {
        btn.addEventListener("click", e => {
          e.stopPropagation();
          const id = btn.dataset.id;
          const added = toggleWishlist(id);
          const path  = btn.querySelector("path");
          path.setAttribute("fill", added ? "#e53e3e" : "none");
          path.setAttribute("stroke", added ? "#e53e3e" : "#555");
          toast(added ? "Added to Wishlist" : "Removed from Wishlist");
        });
      });

      updateCartBadge();
    }

    window.quickAdd = function(id) {
      const p = PRODUCTS.find(x => x.id === id);
      if (!p) return;
      addToCart(p, p.sizes[0], p.colors[0], 1);
      toast("Added to cart!");
      updateCartBadge();
    };

    function updateCartBadge() {
      const cart  = JSON.parse(localStorage.getItem("sf_cart") || "[]");
      const count = cart.reduce((s,i) => s + (i.qty||1), 0);
      const badge = document.getElementById("cartBadge");
      badge.textContent = count;
      badge.style.display = count > 0 ? "flex" : "none";
    }

    function toast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg; t.classList.add("show");
      clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 2500);
    }

    // Category filter clicks
    document.getElementById("catFilters").addEventListener("click", e => {
      const btn = e.target.closest(".filter-chip");
      if (!btn) return;
      document.querySelectorAll(".filter-chip").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentCat = btn.dataset.cat;
      render();
    });

    // Search
    document.getElementById("searchInput").addEventListener("input", e => {
      currentQ = e.target.value;
      render();
    });

    // Sort
    document.getElementById("sortSelect").addEventListener("change", e => {
      currentSort = e.target.value;
      render();
    });

    render();
  </script>
</body>
</html>
